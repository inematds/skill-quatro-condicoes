name: Deploy static site to Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  # build e deploy em jobs separados: o deploy só começa depois que o
  # artifact terminou de subir (no job único o deploy-pages não o achava)
  build:
    runs-on: ubuntu-latest
    steps:
      # ações fixadas pelo SHA (uma tag pode ser movida; o SHA não)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      # publica só o guia (em /guia/), não os scripts do kit
      - run: mkdir -p _site && cp -r guia _site/guia && touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: '_site' }
  deploy:
    needs: build
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
